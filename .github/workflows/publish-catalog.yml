#
# Publishes the item catalogue both DashSkins platforms read.
#
# The deployment is one snapshot of one pipeline run, so the P2P api and the bots frontend cannot drift: both
# record the same Steam build id and both read the same files.
#
# Three ways in, on purpose:
#   schedule  - checks daily whether the game shipped new items, and does nothing when it did not
#   push      - a change to the generator's own code changes the output, so it republishes
#   manual    - publish regardless
#
name: Publish catalog

on:
  # CS2 items arrive in batches with no announcement, so the schedule is a watcher rather than a rebuild: the
  # check job costs two HTTP requests and stops there when the Steam manifest has not moved.
  # Note GitHub disables scheduled workflows after 60 days with no repository activity - that is what silently
  # happened to update-and-group.yml. The push trigger below keeps this one alive as long as anyone touches the
  # generator; if the repository goes quiet for two months, re-enable it from the Actions tab.
  schedule:
    - cron: "0 9 * * *"

  workflow_dispatch:
    inputs:
      force:
        description: "Publicar mesmo se o jogo não tiver mudado"
        required: false
        default: true
        type: boolean

  # A code change to the generator is worth republishing; a README or workflow edit is not.
  push:
    branches: [main]
    paths:
      - "*.js"
      - "services/**"
      - "utils/**"

concurrency:
  group: publish-catalog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Cheap gate. Only the scheduled run can be skipped: a push means the generator itself changed, and a manual
  # run means someone decided.
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      steam: ${{ steps.compare.outputs.steam }}
    steps:
      - id: compare
        name: O jogo mudou?
        run: |
          STEAM=$(curl -sfL https://raw.githubusercontent.com/ByMykel/counter-strike-file-tracker/main/static/manifestId.txt | tr -d '[:space:]')
          PUBLICADO=$(curl -sfL https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/version.json | jq -r '.manifestId // empty' || true)

          echo "steam=$STEAM" >> "$GITHUB_OUTPUT"
          {
            echo "manifesto da Steam : ${STEAM:-indisponível}"
            echo "manifesto publicado: ${PUBLICADO:-nenhum}"
          } >> "$GITHUB_STEP_SUMMARY"

          # An empty STEAM means the tracker is unreachable; on a schedule treat that as "no news" rather than
          # rebuilding against data we could not verify.
          if [ "${{ github.event_name }}" = "schedule" ] && { [ -z "$STEAM" ] || [ "$STEAM" = "$PUBLICADO" ]; }; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Nada a fazer." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      # Always forced. update.js exits early when the Steam manifest has not moved, writing nothing - and
      # public/api/pt-BR is not tracked, so on a clean CI checkout there would then be nothing for generate-files
      # to read. Deciding whether there is anything to do is the check job's business, not update.js's.
      - name: Baixar dados do jogo
        id: dados
        run: npm run update-data-force

      # group-data is deliberately absent: it only builds a 62 MB all.json that neither platform reads.
      - name: Gerar arquivos do bots
        id: gerar
        run: npm run generate-files

      - name: Montar dist/
        id: montar
        run: node buildDist.js

      # What actually arrived, against what is published right now. Has to run BEFORE the deploy, while the old
      # snapshot is still the one on gh-pages.
      - name: Comparar com o publicado
        run: node compareWithPublished.js "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages"

      - name: Resumo
        run: |
          {
            echo "### Catálogo publicado"
            echo ""
            jq -r '"Build **\(.manifestId)**" + (if .previousManifestId == null then " (primeira publicação)" else " — anterior \(.previousManifestId)" end)' changes.json
            echo ""
            jq -r '"| entram | mudam | somem | total |\n|---|---|---|---|\n| \(.added) | \(.changed) | \(.removed) | \(.total) |"' changes.json
            echo ""
            jq -r 'if (.addedByCategory | length) > 0 then "Novos por categoria: " + (.addedByCategory | to_entries | map("`\(.key)` \(.value)") | join(" · ")) else "" end' changes.json
            echo ""
            echo "Tamanho: $(du -sh dist | cut -f1)"
            echo ""
            echo "Agora: preview no painel do P2P, e \`npm run items:update\` no new-frontend."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true
          commit-message: "catálogo build ${{ needs.check.outputs.steam }}"

      # Only after the deploy succeeded, so the message never announces something that is not actually there.
      # Silently skipped when the secret is absent - the publish is the point, the notification is a courtesy.
      - name: Avisar no Discord
        if: env.WEBHOOK != ''
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          DESC=$(jq -r '
            (if .previousManifestId == null
               then "Primeira publicação do catálogo."
               else "Build `\(.previousManifestId)` → `\(.manifestId)`" end)
            + "\n\n**\(.added)** entram · **\(.changed)** mudam · **\(.removed)** somem · \(.total) no total"
            + (if (.addedByCategory | length) > 0
                 then "\n\n" + (.addedByCategory | to_entries | map("`\(.key)` \(.value)") | join("  ·  "))
                 else "" end)
            + (if (.addedSamples | length) > 0
                 then "\n\n_" + (.addedSamples | join(", ")) + "_"
                 else "" end)
            + (if (.added + .changed + .removed) > 0
                 then "\n\nFalta aplicar: preview no painel do P2P, e `npm run items:update` no new-frontend."
                 else "\n\nNenhum item mudou — republicação por mudança no gerador, não há o que aplicar."
               end)
          ' changes.json)

          jq -n --arg desc "$DESC" --arg url "$RUN_URL" '{
            username: "Catálogo CS2",
            embeds: [{
              title: "Catálogo publicado",
              description: $desc,
              url: $url,
              color: 3066993
            }]
          }' | curl -sS -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK"

      # The success notification only fires after a good deploy, which leaves silence meaning two different
      # things: the game did not change, or the run broke. This closes that. It matters most for the scheduled
      # run, where nobody is watching - and the generator really does break on new item shapes: the Cologne 2026
      # highlight keychains shipped without image_inventory and took the whole pipeline down.
      - name: Avisar falha no Discord
        if: failure() && env.WEBHOOK != ''
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          FALHOU="passo desconhecido"
          [ "${{ steps.dados.outcome }}" = "failure" ] && FALHOU="Baixar dados do jogo"
          [ "${{ steps.gerar.outcome }}" = "failure" ] && FALHOU="Gerar arquivos do bots"
          [ "${{ steps.montar.outcome }}" = "failure" ] && FALHOU="Montar dist/"

          DESC="Falhou em **$FALHOU** (disparo: \`${{ github.event_name }}\`)."
          DESC="$DESC"$'\n\n'"O catálogo publicado continua o anterior — nada foi sobrescrito."
          DESC="$DESC"$'\n'"Causa mais comum: a Valve lançou um formato de item novo que o gerador não trata."

          jq -n --arg desc "$DESC" --arg url "$RUN_URL" '{
            username: "Catálogo CS2",
            embeds: [{
              title: "Falha ao publicar o catálogo",
              description: $desc,
              url: $url,
              color: 15158332
            }]
          }' | curl -sS -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK"
